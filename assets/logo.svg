<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6CA" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#E5C378" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA7C11" />
      <stop offset="50%" stop-color="#EEDAA2" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Luxury Monogram "W" (Architectural Facet Design) -->
  <g transform="translate(10, 10)" filter="url(#subtleGlow)">
    <!-- Outer Shield / Diamond Frame Accent -->
    <path d="M35 2 L68 35 L35 68 L2 35 Z" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="1 3" opacity="0.6"/>
    
    <!-- Left Stem of W -->
    <path d="M14 20 L24 54 L30 54 L21 20 Z" fill="url(#goldGrad)"/>
    <!-- Middle-Left Diagonal -->
    <path d="M22 54 L35 24 L39 24 L27 54 Z" fill="url(#goldLight)"/>
    <!-- Middle-Right Diagonal -->
    <path d="M43 54 L31 24 L35 24 L48 54 Z" fill="url(#goldGrad)"/>
    <!-- Right Stem of W -->
    <path d="M49 20 L40 54 L46 54 L56 20 Z" fill="url(#goldLight)"/>

    <!-- Apex Diamond Marker -->
    <circle cx="35" cy="18" r="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main Name: W GESTIÓN -->
  <text x="92" y="44" font-family="'Montserrat', 'Cinzel', -apple-system, sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="3">
    W GESTIÓN
  </text>
  <text x="268" y="44" font-family="'Montserrat', 'Cinzel', -apple-system, sans-serif" font-weight="400" font-size="25" fill="url(#goldGrad)" letter-spacing="3">
    INMOBILIARIA
  </text>

  <!-- Tagline: VIÑA DEL MAR • CONCÓN • REÑACA -->
  <text x="94" y="66" font-family="'Open Sans', -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#A1A1AA" letter-spacing="4">
    CORRETAJE • ADMINISTRACIÓN • INVERSIÓN
  </text>
</svg>
